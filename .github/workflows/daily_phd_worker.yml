name: Shama Abidi — Autonomous AI Research Agent (Daily Discovery, Matching, Gmail Drafts & Cloud DB Sync)

on:
  schedule:
    # Runs automatically in the cloud 4 times daily (every 6 hours) with Laptop OFF
    - cron: "0 3 * * *"   # 08:00 AM PKT
    - cron: "0 9 * * *"   # 02:00 PM PKT
    - cron: "0 15 * * *"  # 08:00 PM PKT
    - cron: "0 21 * * *"  # 02:00 AM PKT
  workflow_dispatch: # Allows manual 1-click run from GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  autonomous-research-agent-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Execute All 7 Scheduled Autonomous Jobs (Discovery, Matching, Funding, Gmail Drafts, Replies, Follow-ups, Health)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_API_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN }}
          WHATSAPP_RECIPIENT_PHONE: ${{ secrets.WHATSAPP_RECIPIENT_PHONE }}
        run: python backend/autonomous_pipeline.py --run-all-jobs

      - name: Commit & Sync Updated Persistent Database Snapshot to Cloud
        run: |
          git config user.name "Shama Abidi Autonomous Cloud Agent"
          git config user.email "shamaabidiphd@gmail.com"
          git add data/production_state.json data/shama_production.db
          if ! git diff --staged --quiet; then
            git commit -m "chore(autonomous-batch): sync daily international professors, funding evidence & Gmail drafts"
            git pull --rebase origin main || true
            git push origin main
          fi
