<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1-Click Approve & Send PhD Email — Shama Abidi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f8fafc; color: #0f172a; padding: 16px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
    .card { background: #ffffff; max-width: 620px; width: 100%; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06); padding: 22px; margin-top: 10px; }
    .badge { display: inline-block; background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; margin-bottom: 10px; }
    h1 { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #475569; margin-bottom: 16px; line-height: 1.45; }
    .field { margin-bottom: 14px; }
    .label { font-size: 11.5px; font-weight: 800; color: #475569; text-transform: uppercase; margin-bottom: 5px; display: block; }
    .input, .textarea { width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 13.5px; color: #0f172a; background: #ffffff; }
    .textarea { min-height: 270px; line-height: 1.55; resize: vertical; }
    .btn-send { width: 100%; padding: 15px 18px; background: #059669; color: #ffffff; font-size: 16px; font-weight: 800; border: none; border-radius: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 4px 14px rgba(5, 150, 105, 0.3); text-decoration: none; margin-bottom: 10px; }
    .btn-send:hover { background: #047857; }
    .btn-secondary { width: 100%; padding: 12px 16px; background: #eff6ff; color: #1d4ed8; font-size: 14px; font-weight: 700; border: 1px solid #bfdbfe; border-radius: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; text-decoration: none; margin-bottom: 8px; }
    .status-box { display: none; margin-top: 14px; padding: 14px; border-radius: 10px; background: #ecfdf5; border: 1px solid #6ee7b7; color: #065f46; font-size: 13.5px; font-weight: 600; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">🎓 Shama Abidi — 1-Click Email Approval</span>
    <h1 id="prof-heading">Approve & Send Email to Professor</h1>
    <p class="sub" id="uni-subheading">AI has prepared this personalized PhD email using your 5 verified PJPS & JPPP publications. Review below and tap <strong>Approve & Send Email</strong>.</p>

    <div class="field">
      <label class="label">Professor / Recipient Email</label>
      <input id="to-input" class="input" type="text" />
    </div>

    <div class="field">
      <label class="label">Email Subject</label>
      <input id="subject-input" class="input" type="text" />
    </div>

    <div class="field">
      <label class="label">Personalized Email Body (Editable)</label>
      <textarea id="body-input" class="textarea"></textarea>
    </div>

    <button class="btn-send" onclick="approveAndSendNow()">
      ✅ Approve & Send Email Now →
    </button>

    <button class="btn-secondary" onclick="openInGmailWeb()">
      📧 Open Directly in Gmail App / Web
    </button>

    <div id="status-box" class="status-box"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const prof = params.get("prof") || "Prof. Dr. Taotao Liu";
    const uni = params.get("uni") || "Department of Pharmacy, First Affiliated Hospital of Guangxi Medical University";
    const to = params.get("to") || "liutaotao@gxmu.edu.cn";
    const paper = params.get("paper") || "Practice model of unit-based clinical pharmacists' individualized daily antimicrobial use density monitoring report on antimicrobial stewardship in intensive care unit (2026)";
    const doi = params.get("doi") || "10.1186/s13756-026-01786-9";

    document.getElementById("prof-heading").textContent = "Approve Email to " + prof;
    document.getElementById("uni-subheading").textContent = uni + " • Matched Paper: \"" + paper + "\"";
    document.getElementById("to-input").value = to;
    document.getElementById("subject-input").value =
      params.get("subject") ||
      `Prospective PhD Applicant in Clinical Pharmacy & Antimicrobial Stewardship — Shama Abidi, MPhil`;

    const defaultBody = `Dear ${prof},

I hope this email finds you well. My name is Shama Abidi, and I am a Senior Clinical Pharmacist at Liaquat National Hospital and Medical College, Karachi, holding an MPhil in Pharmacy Practice from the University of Karachi.

I recently read your 2026 publication, "${paper}" (DOI: ${doi}), and was deeply inspired by your group's work at ${uni}.

Your research directly aligns with my peer-reviewed clinical studies:
1. Prospective interventional ICU/HDU study on Carbapenem Antimicrobial Stewardship (Pak. J. Pharm. Sci., Nov 2022, DOI: 10.36721/PJPS.2022.35.6.REG.1595-1601.1; N=134 patients, 87.3% physician acceptance rate, 62.7% renal CrCl dose adjustments, p=0.036 reduction in 30-day readmissions).
2. First-author observational study on Calcium Channel Blockers vs. Beta Blockers in Angina (Pak. J. Pharm. Sci., May 2024, DOI: 10.36721/PJPS.2024.37.3.REG.639-649.1; N=110 patients, SAQ-7 & Naranjo ADR probability scale).
3. Three May 2025 JPPP abstracts (DOI: 10.1080/20523211.2025.2485639) on High-Alert Medications (#223) and AI vs. Clinical Pharmacist Interventions (#225).

I am writing to inquire whether you are considering doctoral candidates for the upcoming intake. I have attached my CV and published papers for your kind review.

Warm regards,
Shama Abidi, MPhil (Pharmacy Practice)
Senior Pharmacist, Liaquat National Hospital & Medical College, Karachi
Email: shama.abidi80@gmail.com
Phone / WhatsApp: +92 300 2460274`;

    document.getElementById("body-input").value = params.get("body") || defaultBody;

    async function approveAndSendNow() {
      const recipient = document.getElementById("to-input").value.trim();
      const subject = document.getElementById("subject-input").value.trim();
      const body = document.getElementById("body-input").value.trim();
      const statusBox = document.getElementById("status-box");
      statusBox.style.display = "block";
      statusBox.innerHTML = "⏳ Approved by Shama Abidi! Opening your Email Client to dispatch...";

      // Also try calling local FastAPI backend if running
      try {
        const resp = await fetch("http://localhost:8000/api/v1/emails/approve-and-send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            draft_id: "whatsapp-1click",
            supervisor_name: prof,
            recipient_email: recipient,
            subject: subject,
            body: body,
            human_approved: true
          })
        });
        if (resp.ok) {
          const data = await resp.json();
          if (data.status === "SENT_VIA_GMAIL_OAUTH") {
            statusBox.innerHTML = "✅ Email Sent Automatically via Gmail OAuth2 (shama.abidi80@gmail.com) to " + recipient + "!";
            return;
          }
        }
      } catch (_) {}

      // Open default mail app (Gmail on Android/iPhone/Desktop) pre-filled so 1 tap sends it!
      const mailtoUrl = `mailto:${encodeURIComponent(recipient)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      window.location.href = mailtoUrl;
      statusBox.innerHTML = "✅ Approved! Your email app has opened with the full message to <strong>" + recipient + "</strong> — just tap <strong>Send ➤</strong>!";
    }

    function openInGmailWeb() {
      const recipient = document.getElementById("to-input").value.trim();
      const subject = document.getElementById("subject-input").value.trim();
      const body = document.getElementById("body-input").value.trim();
      const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(recipient)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      window.open(gmailUrl, "_blank");
    }
  </script>
</body>
</html>
