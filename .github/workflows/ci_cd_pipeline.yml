name: Shama Abidi PhD System — Production CI/CD & Security Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-migrate-and-test:
    name: Alembic Migrations, Data Integrity, Backup/Restore & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned production dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run Alembic database schema migrations
        run: |
          python -m alembic upgrade head

      - name: Run idempotent data migration & validation check
        run: |
          python scripts/migrate_existing_data.py

      - name: Run disaster recovery backup & restore verification
        run: |
          python scripts/backup_and_restore_test.py

      - name: Run full automated unit, integration, E2E & security test suite
        run: |
          python -m pytest tests/ -v --tb=short -ra
