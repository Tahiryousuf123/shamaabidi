services:
  postgres:
    image: postgres:16-alpine
    container_name: shama_phd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shama_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-shama_phd_intelligence}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shama_admin -d shama_phd_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: shama_phd_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  n8n:
    image: n8nio/n8n:latest
    container_name: shama_phd_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - GENERIC_TIMEZONE=Asia/Karachi
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shama_phd_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-shama_admin}:${POSTGRES_PASSWORD:-secure_local_password}@postgres:5432/${POSTGRES_DB:-shama_phd_intelligence}
      - QDRANT_URL=http://qdrant:6333
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-meta-llama/llama-3.1-8b-instruct:free}
      - GMAIL_SENDER_EMAIL=${GMAIL_SENDER_EMAIL:-shamaabidiphd@gmail.com}
      - GMAIL_OAUTH_CLIENT_ID=${GMAIL_OAUTH_CLIENT_ID:-}
      - GMAIL_OAUTH_CLIENT_SECRET=${GMAIL_OAUTH_CLIENT_SECRET:-}
      - WHATSAPP_WEBHOOK_URL=${WHATSAPP_WEBHOOK_URL:-}
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN:-}
      - WHATSAPP_RECIPIENT_PHONE=${WHATSAPP_RECIPIENT_PHONE:-+923000000000}
      - STRICT_NO_FABRICATION=true
      - HUMAN_APPROVAL_REQUIRED=true
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  autonomous_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shama_phd_autonomous_worker
    restart: unless-stopped
    command: ["python", "worker_scheduler.py", "--daemon"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-shama_admin}:${POSTGRES_PASSWORD:-secure_local_password}@postgres:5432/${POSTGRES_DB:-shama_phd_intelligence}
      - QDRANT_URL=http://qdrant:6333
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-meta-llama/llama-3.1-8b-instruct:free}
      - GMAIL_SENDER_EMAIL=${GMAIL_SENDER_EMAIL:-shamaabidiphd@gmail.com}
      - WHATSAPP_WEBHOOK_URL=${WHATSAPP_WEBHOOK_URL:-}
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN:-}
      - WHATSAPP_RECIPIENT_PHONE=${WHATSAPP_RECIPIENT_PHONE:-+923000000000}
      - WORKER_CRON_INTERVAL_HOURS=${WORKER_CRON_INTERVAL_HOURS:-24}
    depends_on:
      - backend
      - qdrant

volumes:
  postgres_data:
  qdrant_data:
  n8n_data:
