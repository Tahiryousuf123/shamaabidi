name: Autonomous Daily 50 PhD Professor Discovery & Gmail Drafts

on:
  schedule:
    # 12:00 AM Pakistan Standard Time (PKT, UTC+5) is 19:00 UTC
    - cron: '0 19 * * *'
  workflow_dispatch: # Allows manual 1-click execution anytime from GitHub Actions tab

concurrency:
  group: daily-phd-discovery
  cancel-in-progress: false

jobs:
  discover-and-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --omit=dev

      - name: Run Autonomous 50 Professor Discovery & Draft Generation
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'shamaabidi-3ddf8' }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL || 'firebase-adminsdk-fbsvc@shamaabidi-3ddf8.iam.gserviceaccount.com' }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'shamaabidiphd@gmail.com' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-1.5-flash' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/run-autonomous-50.js
