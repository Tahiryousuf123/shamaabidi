[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Scheduled Cloud Job 1: Daily Professor Discovery, Matching, Funding Verification & 10 Gmail Drafts (08:00 AM PKT / 03:00 UTC)
[functions."scheduled-discovery"]
  schedule = "0 3 * * *"

# Scheduled Cloud Job 2: Gmail Reply Monitoring & 7-Day Follow-up Detection (Every 6 hours)
[functions."scheduled-gmail-monitor"]
  schedule = "0 */6 * * *"

# ------------------------------------------------------------------------------
# SECURITY: Block public access to database files, backups, secrets & source code
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/data/*.db"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/data/*.sqlite*"
  to = "/404.html"
  status = 404
  force = true


[[redirects]]
  from = "/backups/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/backend/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# ------------------------------------------------------------------------------
# PRODUCTION SECURITY HEADERS
# ------------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
